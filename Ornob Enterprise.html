@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101010; --surface: #1A1A1A; --field: #141414; --ink: #F2F2F0; --muted: #A5A5A0;
    --line: #2C2C2A; --line-strong: #5A5A56; --accent: #F2F2F0; --accent-ink: #0B0B0B;
    --tile: #232322; --tile-ink: #44443F; --hero: #000000; --hero-ink: #F2F2F0; --hero-muted: #A5A5A0;
    --focus: #6CC0F0; --danger: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101010; --surface: #1A1A1A; --field: #141414; --ink: #F2F2F0; --muted: #A5A5A0;
  --line: #2C2C2A; --line-strong: #5A5A56; --accent: #F2F2F0; --accent-ink: #0B0B0B;
  --tile: #232322; --tile-ink: #44443F; --hero: #000000; --hero-ink: #F2F2F0; --hero-muted: #A5A5A0;
  --focus: #6CC0F0; --danger: #FF8A80; color-scheme: dark;
}
/* dark bands keep black in both themes: tokens are flipped inside them */
.on-dark {
  --bg: var(--hero); --ink: var(--hero-ink); --muted: var(--hero-muted);
  --accent: var(--hero-ink); --accent-ink: var(--hero); --line-strong: #6A6A66; --line: #2E2E2C; --focus: #6CC0F0;
  background: var(--bg); color: var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--bg);
}
bn, en { display: inline; }
:root:not([data-lang="en"]) en { display: none; }
:root[data-lang="en"] bn { display: none; }

h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
section[id] { scroll-margin-top: 72px; }

.wrap {
  max-width: 1120px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow {
  font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}

.logo {
  display: block; flex: 0 0 auto; border-radius: 50%; background: #fff var(--logo) center / cover no-repeat;
  width: 46px; height: 46px; border: 1px solid var(--line);
}

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; flex: 1; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-text .shop { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .03em; }
.brand-text .tag { font-size: 12px; color: var(--muted); }
@media (max-width: 479px) { .brand-text .tag { display: none; } }
.lang { display: flex; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.lang button {
  font: 600 14px/1 var(--body); padding: 9px 11px; border: 0; background: transparent; color: var(--ink); cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cart-btn {
  position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 700 14px/1 var(--display); padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 3px;
  background: var(--accent); color: var(--accent-ink);
}
.cart-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cart-btn .n { font-variant-numeric: tabular-nums; min-width: 1ch; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px/1 var(--display);
  text-decoration: none; cursor: pointer; padding: 14px 22px; border-radius: 3px; border: 2px solid var(--ink);
  background: transparent; color: var(--ink);
}
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { opacity: .88; }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }
.btn[disabled] { opacity: .5; cursor: default; }

/* hero */
.hero { padding-top: clamp(28px, 6vw, 64px); }
.hero-grid { display: grid; gap: 28px; grid-template-columns: 1fr; align-items: center; }
@media (min-width: 800px) { .hero-grid { grid-template-columns: 1.4fr 1fr; } }
.hero h1 { font-weight: 800; font-size: clamp(2rem, 6vw, 3.8rem); letter-spacing: -.01em; max-width: 16em; margin-top: 14px; }
.hero .lede { margin-top: 16px; max-width: 56ch; font-size: 1.0625rem; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.hero-logo { justify-self: center; width: min(62vw, 300px); aspect-ratio: 1; border-radius: 50%; background: #fff var(--logo) center / cover no-repeat; box-shadow: 0 0 0 10px #1c1c1c, 0 0 0 11px #3a3a38; }
@media (max-width: 799px) { .hero-logo { order: -1; width: 132px; justify-self: start; box-shadow: 0 0 0 6px #1c1c1c, 0 0 0 7px #3a3a38; margin: 6px 0 4px 7px; } }

.sizes-label { margin-top: 40px; }
.sizes {
  margin: 10px 0 0; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
  border-top: 1px solid var(--line-strong);
}
.sizes > div { padding: 14px 12px 20px 14px; border-left: 1px solid var(--line); min-width: 0; }
.sizes > div:first-child { border-left: 0; padding-left: 0; }
.sizes dt { font-family: var(--mono); font-weight: 500; font-size: clamp(1.1rem, 3.2vw, 1.5rem); line-height: 1.2; font-variant-numeric: tabular-nums; }
.sizes dd { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
@media (max-width: 479px) {
  .sizes > div:nth-child(odd) { border-left: 0; padding-left: 0; }
  .sizes > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.ruler {
  height: 30px; margin-top: 30px;
  background-image:
    repeating-linear-gradient(90deg, var(--muted) 0 1.5px, transparent 1.5px 80px),
    repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 8px);
  background-size: 100% 24px, 100% 16px, 100% 9px; background-repeat: no-repeat; background-position: 0 0;
}

/* products */
.products { padding-block: clamp(40px, 7vw, 72px); }
.sec-head { max-width: 60ch; }
.sec-head h2 { font-weight: 800; font-size: clamp(1.6rem, 4.4vw, 2.4rem); margin-top: 8px; }
.sec-head p { margin-top: 10px; color: var(--muted); }
#edit-btn { margin-top: 18px; }
.chips { display: flex; gap: 8px; margin-top: 22px; overflow-x: auto; padding-bottom: 6px; }
.chips a {
  flex: 0 0 auto; text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 14px;
  border: 1.5px solid var(--ink); border-radius: 999px; white-space: nowrap;
}
.chips a:hover { background: var(--ink); color: var(--bg); }
.cats { margin-top: 18px; display: grid; gap: 40px; }
.cat-sec { scroll-margin-top: 80px; min-width: 0; }
.cat-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
.cat-top h3 { font-weight: 800; font-size: 1.45rem; }
.code { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; font-weight: 500; color: var(--muted); }
.pgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 165px), 1fr)); }
.pcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;

<script id="app">
(function () {
  var FONT = 'https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap';
  var CLOSE_SCRIPT = '</' + 'script>';
  var WA = '8801922786011';
  var SHOP = 'M/S ORNOB ENTERPRISE';

  var tplEl = document.getElementById('shell');
  document.body.insertBefore(tplEl.content.cloneNode(true), tplEl);

  var state = JSON.parse(document.getElementById('site-data').textContent);
  var draft = null, editing = false, assets = null, saving = false;
  var cart = [];
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid');

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escA(s) { return esc(s).replace(/"/g, '&quot;'); }
  function bi(b, e) { return '<bn>' + esc(b) + '</bn><en>' + esc(e) + '</en>'; }
  function waLink(text) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text); }

  var root = document.documentElement;
  function curLang() { return root.getAttribute('data-lang') === 'en' ? 'en' : 'bn'; }
  function pick(b, e) { return curLang() === 'en' ? (e || b) : b; }

  function num(p) {
    if (p === '' || p == null) return null;
    var n = Number(p);
    return isNaN(n) ? null : n;
  }
  function moneyHtml(n) { return bi('৳ ' + n.toLocaleString('bn-BD'), '৳ ' + n.toLocaleString('en-US')); }
  function moneyText(n) { return '৳ ' + n.toLocaleString(curLang() === 'en' ? 'en-US' : 'bn-BD'); }
  function qtyHtml(n) { return bi(n.toLocaleString('bn-BD'), n.toLocaleString('en-US')); }

  /* ---------- cart ---------- */
  function keyOf(cid, it) { return cid + '|' + it.bn; }
  function findItem(key) {
    for (var a = 0; a < state.cats.length; a++) {
      var c = state.cats[a];
      for (var b = 0; b < c.items.length; b++) { if (keyOf(c.id, c.items[b]) === key) return c.items[b]; }
    }
    return null;
  }
  function qtyOf(key) { for (var i = 0; i < cart.length; i++) { if (cart[i].k === key) return cart[i].qty; } return 0; }
  function saveCart() { try { localStorage.setItem('mro-cart', JSON.stringify(cart)); } catch (e) {} }
  try {
    var raw = localStorage.getItem('mro-cart');
    if (raw) { var arr = JSON.parse(raw); if (Array.isArray(arr)) cart = arr.filter(function (x) { return x && x.k && x.qty > 0; }); }
  } catch (e) {}

  function setQty(key, qty, snap) {
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].k === key) {
        if (qty <= 0) cart.splice(i, 1); else cart[i].qty = Math.min(qty, 999);
        saveCart(); refreshCart(); return;
      }
    }
    if (qty > 0 && snap) { snap.k = key; snap.qty = qty; cart.push(snap); saveCart(); refreshCart(); }
  }
  function snapOf(it) {
    return { bn: it.bn, en: it.en || it.bn, sbn: it.sbn || it.sen || '', sen: it.sen || it.sbn || '', price: it.price };
  }
  function live(c) {
    var it = findItem(c.k);
    if (!it) return c;
    return { k: c.k, qty: c.qty, bn: it.bn, en: it.en || it.bn, sbn: it.sbn || it.sen || '', sen: it.sen || it.sbn || '', price: it.price };
  }
  function cartTotals() {
    var sum = 0, unpriced = 0, count = 0;
    cart.forEach(function (c) {
      var l = live(c); count += c.qty;
      var p = num(l.price);
      if (p == null) unpriced++; else sum += p * c.qty;
    });
    return { sum: sum, unpriced: unpriced, count: count };
  }

  function refreshCart() {
    var t = cartTotals();
    $('cart-count').textContent = t.count;
    $('cb-count').textContent = t.count;
    $('cb-sum').innerHTML = t.sum > 0 ? moneyHtml(t.sum) : '';
    $('cartbar').hidden = t.count === 0;
    document.body.classList.toggle('has-cart', t.count > 0);
    if (!editing) render();
    if (!$('cart-overlay').hidden) renderCart();
  }

  /* ---------- products ---------- */
  function cardHtml(c, it, ci, ii) {
    var key = keyOf(c.id, it);
    var q = qtyOf(key);
    var specB = it.sbn || it.sen || '', specE = it.sen || it.sbn || '';
    var visual = it.img
      ? '<img src="' + escA(it.img) + '" alt="" loading="lazy">'
      : '<span class="big">' + (specB || specE ? bi(specB, specE) : 'MRO') + '</span>';
    var spec = it.img && (specB || specE) ? '<span class="pspec">' + bi(specB, specE) + '</span>' : '';
    var p = num(it.price);
    var price = p != null ? '<div class="pprice">' + moneyHtml(p) + '</div>' : '<div class="pprice ask">' + bi('দাম জানতে কার্টে রাখুন', 'Add to cart for price') + '</div>';
    var act = q > 0
      ? '<div class="stepper"><button type="button" data-a="dec" data-c="' + ci + '" data-i="' + ii + '" aria-label="-">−</button><span class="q">' + qtyHtml(q) + '</span><button type="button" data-a="inc" data-c="' + ci + '" data-i="' + ii + '" aria-label="+">+</button></div>'
      : '<button type="button" class="btn btn-primary add" data-a="add" data-c="' + ci + '" data-i="' + ii + '">' + bi('কার্টে রাখুন', 'Add to cart') + '</button>';
    return '<article class="pcard" data-c="' + ci + '" data-i="' + ii + '"><div class="pimg">' + visual + '</div>' +
      '<div class="pbody"><span class="pname">' + bi(it.bn, it.en || it.bn) + '</span>' + spec + price + '</div>' +
      '<div class="pact">' + act + '</div></article>';
  }

  function fld(f, lb, le, val, extra) {
    return '<label><span>' + bi(lb, le) + '</span><input data-f="' + f + '" type="text" value="' + escA(val) + '"' + (extra || '') + '></label>';
  }
  function editRow(it, c, i) {
    var thumb = it.img ? '<img class="th" src="' + escA(it.img) + '" alt="">' : '';
    var imgBtns = assets
      ? '<button type="button" class="mini" data-act="img" data-c="' + c + '" data-i="' + i + '">' + bi(it.img ? 'ছবি বদলান' : 'ছবি দিন', it.img ? 'Change photo' : 'Add photo') + '</button>' +
        (it.img ? '<button type="button" class="mini" data-act="noimg" data-c="' + c + '" data-i="' + i + '">' + bi('ছবি সরান', 'Remove photo') + '</button>' : '')
      : '';
    return '<li class="edit" data-c="' + c + '" data-i="' + i + '"><div class="e-grid">' +
      fld('bn', 'নাম (বাংলা)', 'Name (Bangla)', it.bn) +
      fld('en', 'নাম (English)', 'Name (English)', it.en) +
      fld('sbn', 'মাপ / ইউনিট (বাংলা)', 'Size / unit (Bangla)', it.sbn) +
      fld('sen', 'মাপ / ইউনিট (English)', 'Size / unit (English)', it.sen) +
      fld('price', 'দাম (৳)', 'Price (৳)', it.price, ' inputmode="decimal"') +
      '<div class="e-img">' + thumb + imgBtns +
        '<button type="button" class="mini danger" data-act="del" data-c="' + c + '" data-i="' + i + '">' + bi('পণ্যটি মুছুন', 'Delete product') + '</button>' +
      '</div></div></li>';
  }

  function render() {
    var data = editing ? draft : state;
    $('chips').hidden = editing;
    if (editing) {
      grid.className = 'grid';
      grid.innerHTML = data.cats.map(function (c, ci) {
        var rows = c.items.map(function (it, ii) { return editRow(it, ci, ii); }).join('');
        return '<article class="cat" id="cat-' + c.id + '"><div class="cat-head"><span class="code">' + esc(c.code) +
          '</span><h3>' + bi(c.bn, c.en) + '</h3></div><ul>' + rows + '</ul>' +
          '<div class="add-row"><button type="button" class="mini" data-act="add" data-c="' + ci + '">+ ' + bi('নতুন পণ্য', 'Add product') + '</button></div></article>';
      }).join('');
      return;
    }
    grid.className = 'cats';
    $('chips').innerHTML = data.cats.map(function (c) {
      return '<a href="#cat-' + esc(c.id) + '">' + bi(c.bn, c.en) + '</a>';
    }).join('');
    grid.innerHTML = data.cats.map(function (c, ci) {
      var cards = c.items.map(function (it, ii) { return cardHtml(c, it, ci, ii); }).join('');
      return '<section class="cat-sec" id="cat-' + esc(c.id) + '"><div class="cat-top"><h3>' + bi(c.bn, c.en) +
        '</h3><span class="code">' + esc(c.code) + '</span></div>' +
        (cards ? '<div class="pgrid">' + cards + '</div>' : '<p class="empty">' + bi('শীঘ্রই আসছে', 'Coming soon') + '</p>') + '</section>';
    }).join('');
  }

  grid.addEventListener('click', function (e) {
    if (editing) return;
    var card = e.target.closest ? e.target.closest('.pcard') : null;
    if (!card) return;
    var c = state.cats[+card.dataset.c], it = c.items[+card.dataset.i];
    if (!it) return;
    var key = keyOf(c.id, it);
    var btn = e.target.closest('[data-a]');
    var a = btn ? btn.dataset.a : (qtyOf(key) === 0 ? 'add' : null);
    if (a === 'add') setQty(key, 1, snapOf(it));
    else if (a === 'inc') setQty(key, qtyOf(key) + 1);
    else if (a === 'dec') setQty(key, qtyOf(key) - 1);
  });

  /* ---------- cart sheet ---------- */
  var ov = $('cart-overlay'), body = $('cart-body');
  var custName = '', custPhone = '', custAddr = '', custNote = '';

  function orderText() {
    var l = curLang();
    var L = l === 'en'
      ? { head: SHOP + ' - Order', name: 'Name', phone: 'Mobile', addr: 'Address', items: 'Items', total: 'Total (priced items)', ask: 'Please tell me the price of the items without a price.', note: 'Note' }
      : { head: SHOP + ' - অর্ডার', name: 'নাম', phone: 'মোবাইল', addr: 'ঠিকানা', items: 'পণ্য', total: 'মোট (দাম দেওয়া পণ্য)', ask: 'যে পণ্যের দাম দেওয়া নেই, তার দাম জানাবেন।', note: 'মন্তব্য' };
    var lines = [L.head, L.name + ': ' + custName.trim(), L.phone + ': ' + custPhone.trim()];
    if (custAddr.trim()) lines.push(L.addr + ': ' + custAddr.trim());
    lines.push('', L.items + ':');
    var t = cartTotals();
    cart.forEach(function (c, i) {
      var x = live(c), p = num(x.price);
      var sp = pick(x.sbn, x.sen);
      lines.push((i + 1) + '. ' + pick(x.bn, x.en) + (sp ? ' (' + sp + ')' : '') + ' x ' + c.qty + (p != null ? ' = ' + moneyText(p * c.qty) : ''));
    });
    if (t.sum > 0) lines.push('', L.total + ': ' + moneyText(t.sum));
    if (t.unpriced > 0) lines.push(L.ask);
    if (custNote.trim()) lines.push('', L.note + ': ' + custNote.trim());
    return lines.join('\n');
  }
  function updateSendLink() {
    var a = $('send-wa');
    if (a) a.href = waLink(orderText());
  }

  function renderCart() {
    if (!cart.length) {
      body.innerHTML = '<p class="empty">' + bi('কার্ট খালি। পণ্যে চাপ দিয়ে কার্টে রাখুন।', 'Your cart is empty. Tap a product to add it.') + '</p>' +
        '<button type="button" class="btn btn-ghost" id="cart-browse">' + bi('পণ্য দেখুন', 'Browse products') + '</button>';
      return;
    }
    var t = cartTotals();
    var rows = cart.map(function (c, i) {
      var x = live(c), p = num(x.price);
      var sp = (x.sbn || x.sen) ? '<div class="sp">' + bi(x.sbn || x.sen, x.sen || x.sbn) + '</div>' : '';
      return '<div class="crow"><div><div class="nm">' + bi(x.bn, x.en) + '</div>' + sp + '</div>' +
        '<div class="lt">' + (p != null ? moneyHtml(p * c.qty) : '<span class="sp">' + bi('দাম জানানো হবে', 'Price on request') + '</span>') + '</div>' +
        '<div class="stepper"><button type="button" data-ca="dec" data-n="' + i + '" aria-label="-">−</button><span class="q">' + qtyHtml(c.qty) + '</span><button type="button" data-ca="inc" data-n="' + i + '" aria-label="+">+</button></div>' +
        '<button type="button" class="rm" data-ca="rm" data-n="' + i + '">' + bi('বাদ দিন', 'Remove') + '</button></div>';
    }).join('');
    var totals = '<div class="totals">' +
      (t.sum > 0 ? '<div class="tl"><span>' + bi('মোট', 'Total') + '</span><span>' + moneyHtml(t.sum) + '</span></div>' : '') +
      (t.unpriced > 0 ? '<div class="nt">' + bi('দাম ছাড়া পণ্যের দাম আমরা হোয়াটসঅ্যাপে জানাব।', 'We will reply on WhatsApp with the price of items that have none.') + '</div>' : '') + '</div>';
    var form =
      '<div class="field"><label for="c-name">' + bi('আপনার নাম', 'Your name') + '</label><input id="c-name" type="text" autocomplete="name" value="' + escA(custName) + '"></div>' +
      '<div class="field"><label for="c-phone">' + bi('মোবাইল নম্বর', 'Mobile number') + '</label><input id="c-phone" type="tel" inputmode="tel" autocomplete="tel" value="' + escA(custPhone) + '"></div>' +
      '<div class="field"><label for="c-addr">' + bi('ডেলিভারির ঠিকানা', 'Delivery address') + '</label><input id="c-addr" type="text" autocomplete="street-address" value="' + escA(custAddr) + '"></div>' +
      '<div class="field"><label for="c-note">' + bi('মন্তব্য (ইচ্ছা হলে)', 'Note (optional)') + '</label><input id="c-note" type="text" value="' + escA(custNote) + '"></div>';
    body.innerHTML = rows + totals + '<div class="card" style="margin-top:6px">' + form +
      '<p class="warn" id="c-warn" role="alert"></p>' +
      '<a class="btn btn-primary" id="send-wa" href="' + escA(waLink(orderText())) + '" target="_blank" rel="noopener">' + bi('হোয়াটসঅ্যাপে অর্ডার পাঠান', 'Send order on WhatsApp') + '</a>' +
      '<p class="note">' + bi('হোয়াটসঅ্যাপ খুললে অর্ডারটি আগে থেকে লেখা থাকবে। শুধু Send চাপুন। Send না চাপলে অর্ডার আমাদের কাছে পৌঁছাবে না।', 'WhatsApp opens with your order already written. Press Send there. The order does not reach us until you do.') + '</p></div>' +
      '<button type="button" class="link-btn" id="cart-clear">' + bi('কার্ট খালি করুন', 'Clear cart') + '</button>';
  }

  function openCart() { ov.hidden = false; renderCart(); var x = $('cart-close'); if (x) x.focus(); }
  function closeCart() { ov.hidden = true; }
  $('cart-open').addEventListener('click', openCart);
  $('cartbar').addEventListener('click', openCart);
  $('cart-close').addEventListener('click', closeCart);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeCart(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) closeCart(); });

  body.addEventListener('click', function (e) {
    var t = e.target;
    if (t.id === 'cart-browse') { closeCart(); location.hash = 'products'; return; }
    if (t.closest && t.closest('#cart-clear')) { cart = []; saveCart(); refreshCart(); return; }
    var b = t.closest ? t.closest('[data-ca]') : null;
    if (b) {
      var c = cart[+b.dataset.n]; if (!c) return;
      if (b.dataset.ca === 'inc') setQty(c.k, c.qty + 1);
      else if (b.dataset.ca === 'dec') setQty(c.k, c.qty - 1);
      else setQty(c.k, 0);
      return;
    }
    var send = t.closest ? t.closest('#send-wa') : null;
    if (send) {
      var warn = $('c-warn');
      if (!custName.trim() || !custPhone.trim()) {
        e.preventDefault();
        warn.innerHTML = bi('নাম ও মোবাইল নম্বর লিখুন।', 'Please enter your name and mobile number.');
        return;
      }
      warn.textContent = '';
    }
  });
  body.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'c-name') custName = e.target.value;
    else if (id === 'c-phone') custPhone = e.target.value;
    else if (id === 'c-addr') custAddr = e.target.value;
    else if (id === 'c-note') custNote = e.target.value;
    else return;
    updateSendLink();
  });

  /* ---------- enquiry form ---------- */
  function enquiryText() {
    var l = curLang();
    var nm = $('q-name').value.trim(), msg = $('q-msg').value.trim();
    return (l === 'en' ? SHOP + ' - Enquiry' : SHOP + ' - জিজ্ঞাসা') + '\n' +
      (nm ? (l === 'en' ? 'Name: ' : 'নাম: ') + nm + '\n' : '') + msg;
  }
  function updateEnquiry() { $('q-send').href = waLink(enquiryText()); }
  $('q-name').addEventListener('input', updateEnquiry);
  $('q-msg').addEventListener('input', updateEnquiry);
  $('q-send').addEventListener('click', function (e) {
    if (!$('q-msg').value.trim()) {
      e.preventDefault();
      $('q-warn').innerHTML = bi('কী জানতে চান লিখুন।', 'Please write your question.');
    } else { $('q-warn').textContent = ''; }
  });

  /* ---------- language ---------- */
  function setLang(l, save) {
    root.setAttribute('data-lang', l);
    root.setAttribute('lang', l);
    $('btn-bn').setAttribute('aria-pressed', String(l === 'bn'));
    $('btn-en').setAttribute('aria-pressed', String(l === 'en'));
    Array.prototype.forEach.call(document.querySelectorAll('[data-ph-bn]'), function (el) {
      el.placeholder = el.getAttribute('data-ph-' + l);
    });
    var greet = l === 'en' ? 'Hello, I would like to ask about your products.' : 'আসসালামু আলাইকুম, আপনাদের পণ্য সম্পর্কে জানতে চাই।';
    $('wa-fab').href = waLink(greet);
    $('hero-wa').href = waLink(greet);
    updateEnquiry();
    if (!ov.hidden) renderCart();
    if (save) { try { localStorage.setItem('mro-lang', l); } catch (e) {} }
  }
  var start = 'bn';
  try { if (localStorage.getItem('mro-lang') === 'en') start = 'en'; } catch (e) {}
  render();
  setLang(start, false);
  refreshCart();
  $('btn-bn').addEventListener('click', function () { setLang('bn', true); });
  $('btn-en').addEventListener('click', function () { setLang('en', true); });

  /* ---------- owner editing ---------- */
  var editBtn = $('edit-btn'), bar = $('adminbar'), ast = $('admin-status');
  function say(html) { ast.innerHTML = html; }

  var C = window.claude && window.claude.use ? window.claude : null;
  if (C) {
    C.use('user').then(function (u) {
      if (!u) return;
      return Promise.all([u.canEdit(), u.isOwner()]).then(function (r) {
        if (r[0] || r[1]) editBtn.hidden = false;
      });
    }).catch(function () {});
    C.use('assets').then(function (a) { assets = a || null; }).catch(function () {});
  }

  function enterEdit() {
    draft = JSON.parse(JSON.stringify(state));
    editing = true;
    document.body.classList.add('editing');
    bar.hidden = false; editBtn.hidden = true;
    say(bi('পরিবর্তন শেষে "সংরক্ষণ করুন" চাপুন।', 'Press "Save changes" when you are done.'));
    render();
  }
  function leaveEdit() {
    editing = false; draft = null;
    document.body.classList.remove('editing');
    bar.hidden = true; editBtn.hidden = false;
    say('');
    render();
  }
  editBtn.addEventListener('click', enterEdit);
  $('cancel').addEventListener('click', function () { if (!saving) leaveEdit(); });

  grid.addEventListener('input', function (e) {
    var t = e.target;
    if (!editing || !t.dataset || !t.dataset.f) return;
    var li = t.closest('li');
    draft.cats[+li.dataset.c].items[+li.dataset.i][t.dataset.f] = t.value;
  });

  function shrink(file) {
    return createImageBitmap(file).then(function (bm) {
      var sc = Math.min(1, 900 / Math.max(bm.width, bm.height));
      var w = Math.round(bm.width * sc), h = Math.round(bm.height * sc);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bm, 0, 0, w, h);
      return new Promise(function (res, rej) {
        cv.toBlob(function (b) { b ? res(b) : rej(new Error('toBlob')); }, 'image/jpeg', 0.82);
      });
    }).catch(function () { return file; });
  }
  function pickImage(c, i) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      say(bi('ছবি আপলোড হচ্ছে...', 'Uploading photo...'));
      shrink(f).then(function (blob) { return assets.upload(blob); }).then(function (r) {
        draft.cats[c].items[i].img = r.url;
        render();
        say(bi('ছবি যোগ হয়েছে। সংরক্ষণ করুন চাপলে পেজে দেখা যাবে।', 'Photo added. Press Save changes to publish it.'));
      }).catch(function () {
        say(bi('ছবি আপলোড হয়নি। ছোট ছবি দিয়ে আবার চেষ্টা করুন।', 'Photo upload failed. Try a smaller image.'));
      });
    });
    inp.click();
  }

  grid.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !editing) return;
    var act = b.dataset.act, c = +b.dataset.c, i = +b.dataset.i;
    if (act === 'add') {
      draft.cats[c].items.push({ bn: '', en: '', sbn: '', sen: '', price: '', img: '' });
      render();
      var lis = grid.querySelectorAll('#cat-' + draft.cats[c].id + ' li.edit');
      var last = lis[lis.length - 1];
      if (last) { var f = last.querySelector('input'); if (f) f.focus(); }
    } else if (act === 'del') {
      if (!b.dataset.sure) {
        b.dataset.sure = '1';
        b.innerHTML = bi('নিশ্চিত? আবার চাপুন', 'Sure? Tap again');
        setTimeout(function () { if (b.isConnected) { delete b.dataset.sure; b.innerHTML = bi('পণ্যটি মুছুন', 'Delete product'); } }, 3000);
        return;
      }
      draft.cats[c].items.splice(i, 1);
      render();
    } else if (act === 'img') {
      if (assets) pickImage(c, i);
    } else if (act === 'noimg') {
      draft.cats[c].items[i].img = '';
      render();
    }
  });

  function toLatinDigits(s) { return String(s).replace(/[০-৯]/g, function (d) { return '০১২৩৪৫৬৭৮৯'.indexOf(d); }); }
  function normalize(d) {
    d.cats.forEach(function (c) {
      c.items = c.items.filter(function (it) { return (it.bn || '').trim() || (it.en || '').trim(); });
      c.items.forEach(function (it) {
        it.bn = (it.bn || '').trim(); it.en = (it.en || '').trim();
        if (!it.bn) it.bn = it.en;
        it.sbn = (it.sbn || '').trim(); it.sen = (it.sen || '').trim();
        var p = toLatinDigits(it.price == null ? '' : it.price).replace(/[,\s৳]/g, '');
        it.price = (p !== '' && !isNaN(Number(p))) ? Number(p) : '';
      });
    });
  }

  function resetCss() {
    var st = document.head ? document.head.querySelectorAll('style') : [];
    for (var k = 0; k < st.length; k++) { if (/\[hidden\]/.test(st[k].textContent)) return st[k].textContent; }
    return ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  }
  function buildDoc(data) {
    var json = JSON.stringify(data).replace(/</g, '\\u003c');
    var content =
      '<title>Ornob Enterprise</title>\n' +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="' + FONT + '">\n' +
      '<style id="sitecss">' + $('sitecss').textContent + '</style>\n\n' +
      '<template id="shell">' + tplEl.innerHTML + '</template>\n\n' +
      '<script type="application/json" id="site-data">' + json + CLOSE_SCRIPT + '\n' +
      '<script id="app">' + $('app').textContent + CLOSE_SCRIPT + '\n';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      resetCss() + '</style></head><body>' + content + '</body></html>';
  }

  $('save').addEventListener('click', function () {
    if (saving || !editing) return;
    normalize(draft);
    saving = true; $('save').disabled = true;
    say(bi('সংরক্ষণ হচ্ছে...', 'Saving...'));
    var doc = buildDoc(draft);
    (C ? C.use('artifact') : Promise.resolve(null)).then(function (a) {
      if (!a) { var e = new Error('none'); e.code = 'none'; throw e; }
      return a.publish(doc);
    }).then(function () {
      state = draft; say(bi('সংরক্ষণ হয়েছে। পেজ নতুন করে লোড হচ্ছে...', 'Saved. Reloading the page...'));
    }).catch(function (err) {
      saving = false; $('save').disabled = false;
      var code = err && err.code;
      if (code === 'conflict') say(bi('এর মধ্যে অন্য কেউ পেজ বদলেছে। পেজ নতুন করে লোড হচ্ছে, তারপর আবার চেষ্টা করুন।', 'Someone else changed the page. It is reloading, then try again.'));
      else if (code === 'not_writer' || code === 'not_granted' || code === 'none') say(bi('এই পেজ সংরক্ষণের অনুমতি নেই। আপনার নিজের অ্যাকাউন্টে খুলে চেষ্টা করুন।', 'You are not allowed to save this page. Open it in your own account and try again.'));
      else if (code === 'too_large') say(bi('ছবি বা তথ্য অনেক বড়। কিছু ছবি সরিয়ে আবার চেষ্টা করুন।', 'The page is too large. Remove a few photos and try again.'));
      else say(bi('সংরক্ষণ হয়নি। আবার চেষ্টা করুন।', 'Could not save. Please try again.') + (code ? ' (' + esc(code) + ')' : ''));
    });
  });
})();
</script>

</body></html>
